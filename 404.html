<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/application.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/layout.js" defer></script>
    <script src="assets/js/application.js" defer></script>
    <script src="assets/js/logo.js" defer></script>

    <title>404 | Page Not Found</title>
</head>

<style>
    .error-title {
        color: var(--accent-primary, #ff3df2);
        font-size: clamp(6rem, 18vw, 12rem);
        line-height: 1;
        text-shadow:
            0 0 10px currentColor,
            0 0 25px currentColor,
            0 0 50px currentColor;
        animation: neon-flicker 5s infinite;
    }

    @keyframes neon-flicker {

        0%,
        18%,
        22%,
        25%,
        53%,
        57%,
        100% {
            opacity: 1;
            text-shadow:
                0 0 10px currentColor,
                0 0 25px currentColor,
                0 0 50px currentColor;
        }

        20%,
        24%,
        55% {
            opacity: 0.35;
            text-shadow: none;
        }

        21%,
        56% {
            opacity: 0.8;
            text-shadow: 0 0 5px currentColor;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .error-404-title {
            animation: none;
        }
    }
</style>


<body class="d-flex flex-column min-vh-100">

    <div data="header"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center header-offset">
        <div class="container text-center py-5">

            <h1 class="error-title fw-bold mb-4">404</h1>
            <h2 class="h3 fw-bold mb-3">Page Not Found</h2>
            <p class="lead mb-4">Looks like you've wandered into an unexplored part of the internet.</p>

            <a href="/" class="btn btn-light btn-lg hero-cta">Return Home ↗</a>

        </div>
    </main>

    <div data="footer"></div>

</body>

</html>
